# Local run. Production runs in Coolify with the same image and its variables.
services:
  excalidraw:
    image: ghcr.io/vaulttec-dev/excalidraw-full:latest
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      DATA_SOURCE_NAME: /data/excalidraw.db
    volumes:
      - ./data:/data
